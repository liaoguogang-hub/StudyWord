# v1.7.0 (Phase 0):KMP shared 模块的快速反馈通道。
#
# 设计:
#   - 跑在 ubuntu-latest(免费、不吃 macOS 分钟);
#   - 只跑 :shared 项目的 jvmTest + lint,**不**编 Android/iOS;
#   - main / PR / feature 分支全部触发,作为 1-2 分钟的快速冒烟;
#   - macOS iOS 构建只在 main / PR 触发,见 ios-build.yml。
name: shared-tests

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-jvm:
    name: shared · JVM tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 现有 Android CI 也跑这个脚本,保持双端字库顺序一致。
      - name: Verify character library data
        run: python3 scripts/verify_character_sets.py

      # 只跑 shared 模块的 JVM 单元测试(commonTest),秒级反馈。
      - name: shared · JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace

      # shared 模块的 Android target 必须还能编(避免 Android 集成点回归)。
      # 只 assemble,不 lint——Android lint 由现有 ci.yml 负责,避免重复。
      - name: shared · Android target assemble
        run: ./gradlew :shared:assembleDebug --stacktrace

      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-reports
          path: |
            shared/build/reports/tests/**
            shared/build/reports/lint-results-debug.html
          if-no-files-found: ignore
